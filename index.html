<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>friendship.exe</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="terminal">

<pre id="output"></pre>

<button id="enterBtn" onclick="showLetter()">

ENTER ❤️

</button>

</div>

<div id="letter">

<h1>Happy Friendship Day ❤️</h1>

<p id="message"></p>

<button onclick="showSecret()">

One Last Thing...

</button>

<div id="secret">

<h2>❤️ You Found My Secret ❤️</h2>

<p>

Thank you for being my best friend.

My favorite notification.

My safe place.

And my favorite person.

No matter how many miles separate us,

I'd still choose you.

Every.

Single.

Time.

Happy Friendship Day ❤️

I love you.

</p>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
